# Render Blueprint — free API for EGX
# https://dashboard.render.com/blueprints
#
# After deploy, copy the service URL (e.g. https://egx-api.onrender.com)
# into GitHub → Settings → Variables → VITE_API_BASE, then re-run Pages deploy.

services:
  - type: web
    name: egx-api
    runtime: node
    plan: free
    region: frankfurt
    # Scrape during build so latest.json ships with the deploy slug.
    # Boot-time ensureMarketData() retries if the file is still missing.
    buildCommand: npm install && PRICE_SOURCE=yahoo BATCH_SIZE=16 npm run scrape
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PRICE_SOURCE
        value: yahoo
      - key: BATCH_SIZE
        value: "16"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CURSOR_API_KEY
        sync: false
      - key: REFRESH_SECRET
        sync: false
